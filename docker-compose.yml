services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adf
      POSTGRES_PASSWORD: adf
      POSTGRES_DB: adf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adf"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://adf:adf@db:5432/adf
      REDIS_URL: redis://redis:6379/0
    command: >-
      sh -c "alembic upgrade head &&
             uvicorn adf.api.app:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://adf:adf@db:5432/adf
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "adf.worker.main"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  discord-bot:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://adf:adf@db:5432/adf
      REDIS_URL: redis://redis:6379/0
      API_BASE_URL: http://api:8000
    command: ["python", "-m", "adf.discord_bot.main"]
    restart: on-failure
    depends_on:
      - api

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
