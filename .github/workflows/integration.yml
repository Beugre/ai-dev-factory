name: Integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adf
          POSTGRES_PASSWORD: adf
          POSTGRES_DB: adf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U adf"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://adf:adf@localhost:5432/adf_test
      REDIS_URL: redis://localhost:6379/0
      AGENT_RUNTIME: mock
      NOTIFICATION_GATEWAY: mock
      DEPLOYMENT_MODE: mock
    defaults:
      run:
        working-directory: packages/adf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Apply migrations
        working-directory: .
        run: alembic upgrade head
      - run: pytest -q -m "integration or not integration"
