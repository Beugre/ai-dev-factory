name: OpenAPI

on:
  pull_request:
    paths: ["packages/adf/**", ".github/workflows/openapi.yml"]

permissions:
  contents: read

jobs:
  export-openapi:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./openapi.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "./packages/adf[dev]"
      - name: Generate OpenAPI spec
        run: |
          python - <<'PY'
          import json
          from adf.api.app import create_app
          spec = create_app().openapi()
          with open("openapi.json", "w") as f:
              json.dump(spec, f, indent=2)
          print("paths:", len(spec["paths"]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: openapi.json
