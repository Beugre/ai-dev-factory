name: Backend

on:
  push:
    branches: [main]
    paths: ["packages/adf/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["packages/adf/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/adf

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy adf

  test:
    runs-on: ubuntu-latest
    env:
      AGENT_RUNTIME: mock
      NOTIFICATION_GATEWAY: mock
      DEPLOYMENT_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov=adf --cov-report=term-missing
