version: 2
updates:
  - package-ecosystem: pip
    directory: "/packages/adf"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["type:technical"]

  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["type:technical"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["type:technical"]

  - package-ecosystem: docker
    directory: "/infra/docker"
    schedule:
      interval: weekly
    labels: ["type:technical"]
