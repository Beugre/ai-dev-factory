# Production Docker Compose — VPS.
# Les ports DB/Redis ne sont PAS exposés publiquement.
# Accès externe uniquement via nginx (port 80/443).
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: adf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adf}
      POSTGRES_DB: adf
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adf"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Pas de ports exposés en prod : DB interne seulement.

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://adf:${POSTGRES_PASSWORD:-adf}@db:5432/adf
      REDIS_URL: redis://redis:6379/0
    command: >-
      sh -c "alembic upgrade head &&
             uvicorn adf.api.app:app --host 0.0.0.0 --port 8000 --workers 2"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://adf:${POSTGRES_PASSWORD:-adf}@db:5432/adf
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "adf.worker.main"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  discord-bot:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: on-failure
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://adf:${POSTGRES_PASSWORD:-adf}@db:5432/adf
      REDIS_URL: redis://redis:6379/0
      API_BASE_URL: http://api:8000
    command: ["python", "-m", "adf.discord_bot.main"]
    depends_on:
      - api

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    environment:
      VITE_API_BASE_URL: ${API_PUBLIC_URL:-http://localhost:8000}

  # Note: nginx est géré par le système (nginx.service) sur ce VPS.
  # Voir infra/docker/nginx-site.conf pour la config du vhost.


volumes:
  pgdata:
  redisdata:
