server {
    listen 80;
    server_name _;

    # Utilise le resolver DNS interne Docker pour résoudre les upstreams
    # même si les conteneurs redémarrent.
    resolver 127.0.0.11 valid=10s;

    set $api_upstream  http://api:8000;
    set $web_upstream  http://web:80;

    # Santé (pas de log pour les sondes)
    location /health {
        proxy_pass $api_upstream;
        access_log off;
    }

    # API
    location /api/ {
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }

    # Docs OpenAPI (Swagger UI)
    location ~ ^/(docs|redoc|openapi.json)$ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Métriques — accès restreint aux sources locales
    location /metrics {
        allow 127.0.0.1;
        deny  all;
        proxy_pass $api_upstream;
    }

    # PWA web
    location / {
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
