server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback so client-side routes work on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache built assets aggressively; index.html stays fresh.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
