# Virtual host AI Dev Factory — à placer dans /etc/nginx/sites-available/ai-dev-factory
# puis : ln -s /etc/nginx/sites-available/ai-dev-factory /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name 213.199.41.168;

    # Santé (pas de log pour les sondes)
    location /health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    # API + docs OpenAPI
    location ~ ^/(api|docs|redoc|openapi\.json|metrics) {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Correlation-ID  $request_id;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }

    # PWA web
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
